<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La última misión - Atractores de Lorenz</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            touch-action: manipulation;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Parámetros ajustables
        const params = {
            initialParticles: 50,
            maxParticles: 10000,
            particleGrowthRate: 1,
            particleSize: 2,
            fadeSpeed: 0.05,
            energyBoost: 2,
            boostDuration: 200,
            vortexSpeed: 2,
            vortexTurnSpeed: 0.02,
            interactionRadius: 200,
            lorenz: {
                sigma: 10,
                rho: 28,
                beta: 8 / 3,
                dt: 0.01
            },
            background: {
                particleCount: 500,
                particleSize: 1,
                particleOpacity: 0.3,
                particleSpeed: 0.01,
                particleInteractionStrength: 0.005,
                particleColorChangeSpeed: 0.02
            },
            particleExchangeRate: 0.5,
            particleReturnRate: 0.02,
            exchangedParticleSize: 3,
            exchangedParticleGlow: 5
        };

        // Paletas de colores
        const palettes = [
            ['#FF3D3D', '#2CE3DD', '#4A90E2', '#A051E3'],
            ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FDCB6E'],
            ['#2C3E50', '#E74C3C', '#ECF0F1', '#3498DB'],
            ['#8E44AD', '#16A085', '#F39C12', '#2980B9'],
            ['#1ABC9C', '#3498DB', '#9B59B6', '#F1C40F'],
            ['#34495E', '#E67E22', '#27AE60', '#95A5A6']
        ];

        let currentPaletteIndex = 0;

        class Particle {
            constructor(x, y, z, color, isBackground = false) {
                this.x = x;
                this.y = y;
                this.z = z;
                this.originalX = x;
                this.originalY = y;
                this.originalZ = z;
                this.color = color;
                this.targetColor = color;
                this.isBackground = isBackground;
                this.vortex = null;
                this.exchangeTimer = 0;
                this.size = isBackground ? params.background.particleSize : params.particleSize;
            }

            update(vortex) {
                if (this.isBackground) {
                    this.x += (this.originalX - this.x) * params.background.particleSpeed;
                    this.y += (this.originalY - this.y) * params.background.particleSpeed;
                    this.z += (this.originalZ - this.z) * params.background.particleSpeed;
                    
                    // Transición suave del color
                    this.color = this.lerpColor(this.color, this.targetColor, params.background.particleColorChangeSpeed);
                } else if (vortex) {
                    const {sigma, rho, beta, dt} = params.lorenz;
                    let dx = sigma * (this.y - this.x) * dt;
                    let dy = (this.x * (rho - this.z) - this.y) * dt;
                    let dz = (this.x * this.y - beta * this.z) * dt;

                    this.x += dx * vortex.speed;
                    this.y += dy * vortex.speed;
                    this.z += dz * vortex.speed;
                }

                if (this.exchangeTimer > 0) {
                    this.exchangeTimer--;
                    this.size = params.exchangedParticleSize * (1 + Math.sin(this.exchangeTimer * 0.1) * 0.5);
                    if (this.exchangeTimer === 0) {
                        this.color = this.vortex.color;
                        this.size = params.particleSize;
                    }
                }
            }

            draw(offsetX, offsetY) {
                const scale = 10;
                ctx.beginPath();
                ctx.arc(
                    offsetX + this.x * scale,
                    offsetY + this.z * scale,
                    this.size,
                    0,
                    Math.PI * 2
                );
                ctx.fillStyle = this.color;
                ctx.fill();

                if (this.exchangeTimer > 0 && !this.isBackground) {
                    ctx.beginPath();
                    ctx.arc(
                        offsetX + this.x * scale,
                        offsetY + this.z * scale,
                        this.size + params.exchangedParticleGlow,
                        0,
                        Math.PI * 2
                    );
                    ctx.fillStyle = `rgba(${parseInt(this.color.slice(1,3),16)}, ${parseInt(this.color.slice(3,5),16)}, ${parseInt(this.color.slice(5,7),16)}, 0.3)`;
                    ctx.fill();
                }
            }

            lerpColor(a, b, amount) {
                const ah = parseInt(a.replace(/#/g, ''), 16);
                const ar = ah >> 16;
                const ag = ah >> 8 & 0xff;
                const ab = ah & 0xff;
                const bh = parseInt(b.replace(/#/g, ''), 16);
                const br = bh >> 16;
                const bg = bh >> 8 & 0xff;
                const bb = bh & 0xff;
                const rr = ar + amount * (br - ar);
                const rg = ag + amount * (bg - ag);
                const rb = ab + amount * (bb - ab);

                return `#${((1 << 24) + (rr << 16) + (rg << 8) + rb | 0).toString(16).slice(1)}`;
            }
        }

        class Vortex {
            constructor(x, y, color) {
                this.position = {x: x, y: y};
                this.velocity = {
                    x: (Math.random() - 0.5) * params.vortexSpeed,
                    y: (Math.random() - 0.5) * params.vortexSpeed
                };
                this.color = color;
                this.particles = [];
                this.speed = 1;
                this.boostTimer = 0;
                this.turnTimer = 0;

                for (let i = 0; i < params.initialParticles; i++) {
                    this.addParticle();
                }
            }

            addParticle() {
                const x0 = Math.random() * 20 - 10;
                const y0 = Math.random() * 20 - 10;
                const z0 = Math.random() * 20 - 10;
                this.particles.push(new Particle(x0, y0, z0, this.color));
            }

            update() {
                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                if (this.position.x < 0 || this.position.x > width) {
                    this.velocity.x *= -1;
                }
                if (this.position.y < 0 || this.position.y > height) {
                    this.velocity.y *= -1;
                }

                if (--this.turnTimer <= 0) {
                    this.velocity.x += (Math.random() - 0.5) * params.vortexTurnSpeed;
                    this.velocity.y += (Math.random() - 0.5) * params.vortexTurnSpeed;
                    const speed = Math.sqrt(this.velocity.x ** 2 + this.velocity.y ** 2);
                    this.velocity.x = (this.velocity.x / speed) * params.vortexSpeed;
                    this.velocity.y = (this.velocity.y / speed) * params.vortexSpeed;
                    this.turnTimer = Math.random() * 100 + 50;
                }

                this.particles.forEach(particle => {
                    particle.update(this);
                    particle.vortex = this;
                });

                if (this.boostTimer > 0) {
                    this.boostTimer--;
                    if (this.boostTimer === 0) {
                        this.speed = 1;
                    }
                }
            }

            draw() {
                this.particles.forEach(particle => particle.draw(this.position.x, this.position.y));
            }

            energize() {
                this.speed = params.energyBoost;
                this.boostTimer = params.boostDuration;
            }
        }

        const vortices = [
            new Vortex(width * 0.25, height * 0.25, palettes[currentPaletteIndex][0]),
            new Vortex(width * 0.75, height * 0.25, palettes[currentPaletteIndex][1]),
            new Vortex(width * 0.25, height * 0.75, palettes[currentPaletteIndex][2]),
            new Vortex(width * 0.75, height * 0.75, palettes[currentPaletteIndex][3])
        ];

        const backgroundParticles = [];
        for (let i = 0; i < params.background.particleCount; i++) {
            backgroundParticles.push(new Particle(
                Math.random() * width,
                Math.random() * height,
                Math.random() * 20 - 10,
                `rgba(255, 255, 255, ${params.background.particleOpacity})`,
                true
            ));
        }

        function exchangeParticles(v1, v2, distance) {
            const exchangeCount = Math.floor(params.particleExchangeRate * (1 - distance / params.interactionRadius) * v1.particles.length);
            
            for (let i = 0; i < exchangeCount; i++) {
                if (v1.particles.length > 0 && v2.particles.length > 0) {
                    const p1 = v1.particles.pop();
                    const p2 = v2.particles.pop();
                    
                    p1.color = v2.color;
                    p2.color = v1.color;
                    p1.exchangeTimer = params.boostDuration;
                    p2.exchangeTimer = params.boostDuration;
                    
                    v2.particles.push(p1);
                    v1.particles.push(p2);
                }
            }
        }

        function checkInteractions() {
            let interacting = false;
            for (let i = 0; i < vortices.length; i++) {
                for (let j = i + 1; j < vortices.length; j++) {
                    const v1 = vortices[i];
                    const v2 = vortices[j];
                    const dx = v1.position.x - v2.position.x;
                    const dy = v1.position.y - v2.position.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < params.interactionRadius) {
                        interacting = true;
                        v1.energize();
                        v2.energize();
                        const angle = Math.atan2(dy, dx);
                        const force = (params.interactionRadius - distance) / params.interactionRadius;
                        v1.velocity.x += Math.cos(angle) * force * 0.1;
                        v1.velocity.y += Math.sin(angle) * force * 0.1;
                        v2.velocity.x -= Math.cos(angle) * force * 0.1;
                        v2.velocity.y -= Math.sin(angle) * force * 0.1;

                        exchangeParticles(v1, v2, distance);
                    }
                }
            }

            if (interacting) {
                const totalParticles = vortices.reduce((sum, vortex) => sum + vortex.particles.length, 0);
                if (totalParticles < params.maxParticles) {
                    for (let i = 0; i < params.particleGrowthRate; i++) {
                        const vortex = vortices[Math.floor(Math.random() * vortices.length)];
                        vortex.addParticle();
                    }
                }
            }
        }

        function updateBackgroundParticles() {
            backgroundParticles.forEach(particle => {
                vortices.forEach(vortex => {
                    const dx = particle.x - vortex.position.x;
                    const dy = particle.y - vortex.position.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < params.interactionRadius) {
                        const force = (params.interactionRadius - distance) / params.interactionRadius;
                        particle.x += dx * force * params.background.particleInteractionStrength;
                        particle.y += dy * force * params.background.particleInteractionStrength;
                        particle.targetColor = vortex.color;
                    }
                });
                particle.update();
            });
        }

        function animate() {
            ctx.fillStyle = `rgba(0, 0, 0, ${params.fadeSpeed})`;
            ctx.fillRect(0, 0, width, height);

            updateBackgroundParticles();
            backgroundParticles.forEach(particle => particle.draw(0, 0));

            vortices.forEach(vortex => {
                vortex.update();
                vortex.draw();
            });

            checkInteractions();

            requestAnimationFrame(animate);
        }

        animate();

        // Cambiar paleta con un toque
        canvas.addEventListener('click', () => {
            currentPaletteIndex = (currentPaletteIndex + 1) % palettes.length;
            vortices.forEach((vortex, index) => {
                vortex.color = palettes[currentPaletteIndex][index % palettes[currentPaletteIndex].length];
                vortex.particles.forEach(particle => {
                    if (particle.exchangeTimer === 0) {
                        particle.color = vortex.color;
                    }
                });
            });
        });
    </script>
</body>
</html>
