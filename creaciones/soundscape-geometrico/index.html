<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación Geométrica Techno Rítmica con Soundscape</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        #audioControl {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.3s;
        }
        #audioControl:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="audioControl">🔊 Play/Pause</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audioControl = document.getElementById('audioControl');

        let width = window.innerWidth;
        let height = window.innerHeight;

        canvas.width = width;
        canvas.height = height;

        const params = {
            gridSize: 8, // Incrementado a 8 para una cuadrícula más densa
            cellSize: Math.min(width, height) / 10,
            beatInterval: 300, // Acelerado para un ritmo más techno
            pulseScale: 0.3,
            colorChangeSpeed: 0.1,
            slideSpeed: 0.3,
            trailOpacity: 0.05, // Para efectos de rastro más suaves
            particleCount: 50 // Añadido para efectos de partículas
        };

        const colors = ['#00FFFF', '#FF00FF', '#7FFF00', '#FF1493', '#1E90FF', '#FF4500', '#FFD700', '#00FF7F'];

        // Audio setup
        let audioContext;
        let isPlaying = false;
        let mainGainNode;
        let backgroundSound;

        function setupAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            mainGainNode = audioContext.createGain();
            mainGainNode.connect(audioContext.destination);
            mainGainNode.gain.setValueAtTime(0.4, audioContext.currentTime); // Incrementado el volumen principal
                
            backgroundSound = createBackgroundSound();

            // Añadiendo una línea de bajo para más profundidad
            createBassLine();
        }

        function createBackgroundSound() {
            const osc1 = audioContext.createOscillator();
            const osc2 = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            osc1.type = 'sawtooth'; // Cambiado a 'sawtooth' para un sonido más techno
            osc2.type = 'sawtooth';
            osc1.frequency.setValueAtTime(120, audioContext.currentTime);
            osc2.frequency.setValueAtTime(125, audioContext.currentTime);
            
            gainNode.gain.setValueAtTime(0.05, audioContext.currentTime); // Incrementado para más presencia
            
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(mainGainNode);
            
            osc1.start();
            osc2.start();
            
            return { osc1, osc2, gainNode };
        }

        function createBassLine() {
            const bassOsc = audioContext.createOscillator();
            const bassGain = audioContext.createGain();
            bassOsc.type = 'square';
            bassOsc.frequency.setValueAtTime(60, audioContext.currentTime); // Frecuencia de bajo
            bassGain.gain.setValueAtTime(0.02, audioContext.currentTime);

            bassOsc.connect(bassGain);
            bassGain.connect(mainGainNode);
            bassOsc.start();

            // Modulación de frecuencia para un efecto más rítmico
            bassOsc.frequency.setValueAtTime(60, audioContext.currentTime);
            bassOsc.frequency.exponentialRampToValueAtTime(60, audioContext.currentTime + params.beatInterval / 1000);
        }

        function playSound(shapeType) {
            if (!isPlaying) return;

            const now = audioContext.currentTime;
            let osc, gainNode;

            switch(shapeType) {
                case 0: // Círculo - kick
                    osc = audioContext.createOscillator();
                    gainNode = audioContext.createGain();
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
                    gainNode.gain.setValueAtTime(1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.connect(gainNode);
                    gainNode.connect(mainGainNode);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 1: // Cuadrado - snare
                    osc = audioContext.createOscillator();
                    gainNode = audioContext.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(100, now);
                    gainNode.gain.setValueAtTime(1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gainNode);
                    gainNode.connect(mainGainNode);
                    osc.start(now);
                    osc.stop(now + 0.2);

                    // Añadir ruido para el snare
                    let noise = audioContext.createBufferSource();
                    let noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.2, audioContext.sampleRate);
                    let output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < output.length; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    noise.buffer = noiseBuffer;
                    let noiseGain = audioContext.createGain();
                    noiseGain.gain.setValueAtTime(0.5, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    noise.connect(noiseGain);
                    noiseGain.connect(mainGainNode);
                    noise.start(now);
                    break;
                case 2: // Triángulo - hi-hat
                    osc = audioContext.createOscillator();
                    gainNode = audioContext.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    gainNode.gain.setValueAtTime(0.3, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.connect(gainNode);
                    gainNode.connect(mainGainNode);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
                case 3: // Estrella - efectos adicionales
                    const reverb = audioContext.createConvolver();
                    // Cargar un buffer de reverb (puedes reemplazar con tu propio archivo)
                    fetch('https://cdn.jsdelivr.net/gh/mdn/webaudio-examples@master/decode-audio-data/concert-crowd.ogg')
                        .then(response => response.arrayBuffer())
                        .then(arrayBuffer => audioContext.decodeAudioData(arrayBuffer))
                        .then(audioBuffer => {
                            reverb.buffer = audioBuffer;
                            const effectGain = audioContext.createGain();
                            effectGain.gain.setValueAtTime(0.1, now);
                            const starOsc = audioContext.createOscillator();
                            starOsc.type = 'sawtooth';
                            starOsc.frequency.setValueAtTime(500, now);
                            starOsc.connect(reverb);
                            reverb.connect(effectGain);
                            effectGain.connect(mainGainNode);
                            starOsc.start(now);
                            starOsc.stop(now + 1);
                        })
                        .catch(e => console.error('Error al cargar reverb:', e));
                    break;
            }
        }

        function toggleAudio() {
            if (!audioContext) {
                setupAudio();
                isPlaying = true;
                audioControl.textContent = '🔈 Pause';
            } else if (isPlaying) {
                audioContext.suspend();
                isPlaying = false;
                audioControl.textContent = '🔊 Play';
            } else {
                audioContext.resume();
                isPlaying = true;
                audioControl.textContent = '🔈 Pause';
            }
        }

        audioControl.addEventListener('click', toggleAudio);

        class Shape {
            constructor(x, y, gridX, gridY) {
                this.gridX = gridX;
                this.gridY = gridY;
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.scale = 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.shapeType = Math.floor(Math.random() * 3);
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 2; // Rotación aleatoria
            }

            update(beat) {
                this.x += (this.targetX - this.x) * params.slideSpeed;
                this.y += (this.targetY - this.y) * params.slideSpeed;
                this.scale = 1 + Math.sin(beat + this.pulsePhase) * params.pulseScale;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.scale(this.scale, this.scale);
                switch (this.shapeType) {
                    case 0: // Círculo
                        ctx.beginPath();
                        ctx.arc(0, 0, params.cellSize / 2, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 1: // Cuadrado
                        ctx.fillRect(-params.cellSize / 2, -params.cellSize / 2, params.cellSize, params.cellSize);
                        break;
                    case 2: // Triángulo
                        ctx.beginPath();
                        ctx.moveTo(0, -params.cellSize / 2);
                        ctx.lineTo(-params.cellSize / 2, params.cellSize / 2);
                        ctx.lineTo(params.cellSize / 2, params.cellSize / 2);
                        ctx.closePath();
                        ctx.fill();
                        break;
                }
                ctx.restore();

                // Añadir efecto de rastro
                this.addTrail();
            }

            addTrail() {
                particleSystem.addParticle(this.x, this.y, this.color);
            }

            moveTo(newGridX, newGridY) {
                this.gridX = newGridX;
                this.gridY = newGridY;
                this.targetX = (newGridX + 0.5) * params.cellSize + (width - params.gridSize * params.cellSize) / 2;
                this.targetY = (newGridY + 0.5) * params.cellSize + (height - params.gridSize * params.cellSize) / 2;
                playSound(this.shapeType);
            }
        }

        // Sistema de partículas para efectos visuales adicionales
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = (Math.random() - 0.5) * 2;
                this.color = color;
                this.life = 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.01;
            }

            draw() {
                ctx.fillStyle = `rgba(${hexToRgb(this.color)},${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            addParticle(x, y, color) {
                for (let i = 0; i < params.particleCount / 10; i++) {
                    this.particles.push(new Particle(x, y, color));
                }
            }

            updateAndDraw() {
                this.particles = this.particles.filter(p => p.life > 0);
                this.particles.forEach(p => {
                    p.update();
                    p.draw();
                });
            }
        }

        const particleSystem = new ParticleSystem();

        // Utilidad para convertir hex a rgb
        function hexToRgb(hex) {
            // Eliminar el # si está presente
            hex = hex.replace(/^#/, '');
            if (hex.length === 3) {
                hex = hex.split('').map(h => h + h).join('');
            }
            const bigint = parseInt(hex, 16);
            const r = (bigint >> 16) & 255;
            const g = (bigint >> 8) & 255;
            const b = bigint & 255;
            return `${r},${g},${b}`;
        }

        const shapes = [];
        let emptyCell = { x: params.gridSize - 1, y: params.gridSize - 1 };

        function initShapes() {
            for (let x = 0; x < params.gridSize; x++) {
                for (let y = 0; y < params.gridSize; y++) {
                    if (x !== emptyCell.x || y !== emptyCell.y) {
                        const posX = (x + 0.5) * params.cellSize + (width - params.gridSize * params.cellSize) / 2;
                        const posY = (y + 0.5) * params.cellSize + (height - params.gridSize * params.cellSize) / 2;
                        shapes.push(new Shape(posX, posY, x, y));
                    }
                }
            }
        }

        // Patrón rítmico más complejo para un ritmo techno
        const rhythmPattern = [
            [0, 0], [1, 0], [2, 0], [1, 1], // Kick, Snare, Hi-hat, Snare
            [0, 0], [2, 1], [1, 0], [2, 0], // Kick, Hi-hat, Snare, Hi-hat
            [0, 1], [1, 1], [2, 0], [1, 0], // Kick, Snare, Hi-hat, Snare
            [0, 0], [2, 0], [1, 1], [2, 1]  // Kick, Hi-hat, Snare, Hi-hat
        ];
        let patternIndex = 0;

        function shufflePuzzle() {
            const [shapeType, direction] = rhythmPattern[patternIndex];
            patternIndex = (patternIndex + 1) % rhythmPattern.length;

            const directions = [
                { dx: -1, dy: 0 }, { dx: 1, dy: 0 },
                { dx: 0, dy: -1 }, { dx: 0, dy: 1 }
            ];

            const validMoves = directions.filter(dir => {
                const newX = emptyCell.x + dir.dx;
                const newY = emptyCell.y + dir.dy;
                return newX >= 0 && newX < params.gridSize && newY >= 0 && newY < params.gridSize;
            });

            if (validMoves.length > 0) {
                const move = validMoves[direction % validMoves.length];
                const newEmptyX = emptyCell.x + move.dx;
                const newEmptyY = emptyCell.y + move.dy;
                const shapeToMove = shapes.find(s => s.gridX === newEmptyX && s.gridY === newEmptyY && s.shapeType === shapeType);
                
                if (shapeToMove) {
                    shapeToMove.moveTo(emptyCell.x, emptyCell.y);
                    emptyCell = { x: newEmptyX, y: newEmptyY };
                } else {
                    const anyShape = shapes.find(s => s.gridX === newEmptyX && s.gridY === newEmptyY);
                    if (anyShape) {
                        anyShape.moveTo(emptyCell.x, emptyCell.y);
                        emptyCell = { x: newEmptyX, y: newEmptyY };
                    }
                }
            }
        }

        initShapes();

        let lastTime = 0;
        let beatCount = 0;

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            beatCount += deltaTime / params.beatInterval;
            const beat = Math.PI * 2 * beatCount;

            // Efecto de desenfoque y movimiento
            ctx.fillStyle = `rgba(0, 0, 0, ${params.trailOpacity})`;
            ctx.fillRect(0, 0, width, height);

            shapes.forEach(shape => {
                shape.update(beat);
                shape.draw();
            });

            // Actualizar y dibujar partículas
            particleSystem.updateAndDraw();

            requestAnimationFrame(animate);
        }

        animate(0);
        setInterval(shufflePuzzle, params.beatInterval);
    </script>
</body>
</html>
