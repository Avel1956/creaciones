<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor Cibernético con Paquetes de Información</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            background-color: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="controls">
        Velocidad de órbita: <input type="range" id="orbitSpeed" min="0" max="0.01" step="0.001" value="0.005"><br>
        Frecuencia de paquetes: <input type="range" id="meteorFreq" min="1" max="10" value="5"><br>
        Velocidad de rotación: <input type="range" id="rotationSpeed" min="0" max="0.05" step="0.001" value="0.01">
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const PLANET_RADIUS = 5;
        const METEOR_COUNT = 50;
        const METEOR_MIN_SIZE = 0.1;
        const METEOR_MAX_SIZE = 0.3;
        const IMPACT_WAVE_DURATION = 2; // duración de las ondas de impacto (segundos)
        const IMPACT_WAVE_MAX_SIZE = 1.5; // tamaño máximo de las ondas de impacto

        let scene, camera, renderer, planet, meteorites = [], impactWaves = [];
        const meteoriteCloud = new THREE.Object3D();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            createPlanet();
            createMeteoriteCloud();
            addLighting();

            window.addEventListener('resize', onWindowResize, false);
        }

        function createPlanet() {
            const geometry = new THREE.SphereGeometry(PLANET_RADIUS, 64, 64);

            // Crear material con wireframe para mostrar los bordes
            const material = new THREE.MeshBasicMaterial({
                color: 0x00ffff, // Color cibernético neón
                wireframe: true  // Mostrar los bordes de la malla
            });

            planet = new THREE.Mesh(geometry, material);
            scene.add(planet);
        }

        function createMeteoriteCloud() {
            for (let i = 0; i < METEOR_COUNT; i++) {
                const size = Math.random() * (METEOR_MAX_SIZE - METEOR_MIN_SIZE) + METEOR_MIN_SIZE;
                const geometry = new THREE.BoxGeometry(size, size, size); // Forma cúbica para representar "paquetes"
                const material = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(Math.random(), 1, 0.5) // Colores neón variados
                });
                const meteorite = new THREE.Mesh(geometry, material);

                // Añadir estela al meteorito
                const trailGeometry = new THREE.CylinderGeometry(0.02, 0.05, size * 5, 32);
                const trailMaterial = new THREE.MeshBasicMaterial({
                    color: 0xff00ff, // Color de estela
                    transparent: true,
                    opacity: 0.7
                });
                const trail = new THREE.Mesh(trailGeometry, trailMaterial);
                trail.rotation.x = Math.PI / 2;  // rotar la estela
                meteorite.add(trail);

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const radius = PLANET_RADIUS + Math.random() * 5 + 2;

                meteorite.position.x = radius * Math.sin(phi) * Math.cos(theta);
                meteorite.position.y = radius * Math.sin(phi) * Math.sin(theta);
                meteorite.position.z = radius * Math.cos(phi);

                meteorite.userData = {
                    orbitRadius: radius,
                    orbitSpeed: Math.random() * 0.02 + 0.01,
                    orbitAngle: Math.random() * Math.PI * 2
                };

                meteoriteCloud.add(meteorite);
                meteorites.push(meteorite);
            }
            scene.add(meteoriteCloud);
        }

        function addLighting() {
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 0.5, 0.5);
            scene.add(directionalLight);
        }

        function createImpact(position, strength) {
            // Crear la onda de impacto
            const wave = new THREE.Mesh(
                new THREE.RingGeometry(0.1, 0.2, 32),
                new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.8 })
            );
            wave.position.copy(position);
            wave.lookAt(scene.position);
            scene.add(wave);
            impactWaves.push({ mesh: wave, startTime: Date.now(), strength: strength });
        }

        function updateImpactWaves() {
            const now = Date.now();

            for (let i = impactWaves.length - 1; i >= 0; i--) {
                const wave = impactWaves[i];
                const age = (now - wave.startTime) / 1000;
                if (age > IMPACT_WAVE_DURATION) {
                    scene.remove(wave.mesh);
                    impactWaves.splice(i, 1);
                } else {
                    const scale = 1 + age * wave.strength * IMPACT_WAVE_MAX_SIZE;
                    wave.mesh.scale.set(scale, scale, 1);
                    wave.mesh.material.opacity = 0.8 * (1 - age / IMPACT_WAVE_DURATION);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const orbitSpeed = parseFloat(document.getElementById('orbitSpeed').value);
            const rotationSpeed = parseFloat(document.getElementById('rotationSpeed').value);
            const time = Date.now() * 0.001;

            camera.position.x = Math.cos(time * orbitSpeed) * 15;
            camera.position.z = Math.sin(time * orbitSpeed) * 15;
            camera.lookAt(scene.position);

            planet.rotation.y += rotationSpeed;

            meteoriteCloud.rotation.y += 0.001;

            meteorites.forEach(meteorite => {
                meteorite.userData.orbitAngle += meteorite.userData.orbitSpeed;
                meteorite.position.x = meteorite.userData.orbitRadius * Math.cos(meteorite.userData.orbitAngle);
                meteorite.position.z = meteorite.userData.orbitRadius * Math.sin(meteorite.userData.orbitAngle);

                // Dejar la estela alineada
                const trail = meteorite.children[0]; 
                trail.position.set(meteorite.position.x, meteorite.position.y, meteorite.position.z);
            });

            const meteorFreq = 11 - document.getElementById('meteorFreq').value;
            if (Math.random() < 0.02 / meteorFreq) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const impactPosition = new THREE.Vector3(
                    PLANET_RADIUS * Math.sin(phi) * Math.cos(theta),
                    PLANET_RADIUS * Math.sin(phi) * Math.sin(theta),
                    PLANET_RADIUS * Math.cos(phi)
                );
                createImpact(impactPosition, Math.random() * 0.5 + 0.5);
            }

            updateImpactWaves();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
