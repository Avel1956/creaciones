<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación Geométrica Rítmica Estilo Techno con Audio Dinámico</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #333;
        }
        #audioControl {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="audioControl">Click para activar/desactivar audio</div>
    <script>
        const params = {
            gridSize: 8,
            cellSize: 60,
            beatInterval: 500,
            pulseScale: 0.2,
            colorChangeSpeed: 0.05,
            slideSpeed: 0.2,
            shuffleInterval: 250
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audioControl = document.getElementById('audioControl');

        let width, height;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            params.cellSize = Math.min(width, height) / (params.gridSize * 1.2);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = [
            '#00FFFF', '#FF00FF', '#7FFF00', '#FF1493',
            '#1E90FF', '#FF4500', '#FFD700', '#00FA9A'
        ];

        // Configuración de audio
        let audioContext;
        let isPlaying = false;
        let mainGainNode;

        function setupAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            mainGainNode = audioContext.createGain();
            mainGainNode.connect(audioContext.destination);
            mainGainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        }

        function createOscillator(freq, type) {
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioContext.currentTime);
            osc.connect(gainNode);
            gainNode.connect(mainGainNode);
            return { osc, gainNode };
        }

        function playSound(shapeType) {
            if (!isPlaying) return;

            const now = audioContext.currentTime;
            let osc, gainNode;

            switch(shapeType) {
                case 0: // Círculo - sonido de kick
                    osc = audioContext.createOscillator();
                    gainNode = audioContext.createGain();
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
                    gainNode.gain.setValueAtTime(1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.connect(gainNode);
                    gainNode.connect(mainGainNode);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;

                case 1: // Cuadrado - sonido de snare
                    osc = audioContext.createOscillator();
                    gainNode = audioContext.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(100, now);
                    gainNode.gain.setValueAtTime(1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gainNode);
                    gainNode.connect(mainGainNode);
                    osc.start(now);
                    osc.stop(now + 0.2);

                    // Añadir ruido blanco para el efecto de snare
                    let noise = audioContext.createBufferSource();
                    let noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.2, audioContext.sampleRate);
                    let output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < output.length; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    noise.buffer = noiseBuffer;
                    let noiseGain = audioContext.createGain();
                    noiseGain.gain.setValueAtTime(1, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    noise.connect(noiseGain);
                    noiseGain.connect(mainGainNode);
                    noise.start(now);
                    break;

                case 2: // Triángulo - sonido de hi-hat
                    osc = audioContext.createOscillator();
                    gainNode = audioContext.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.connect(gainNode);
                    gainNode.connect(mainGainNode);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
            }
        }

        function toggleAudio() {
            if (!audioContext) {
                setupAudio();
                isPlaying = true;
            } else if (isPlaying) {
                audioContext.suspend();
                isPlaying = false;
            } else {
                audioContext.resume();
                isPlaying = true;
            }
        }

        audioControl.addEventListener('click', toggleAudio);

        class Shape {
            constructor(x, y, gridX, gridY) {
                this.gridX = gridX;
                this.gridY = gridY;
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.scale = 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.targetColor = this.color;
                this.shapeType = Math.floor(Math.random() * 3);
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.glowIntensity = 0;
            }

            update(beat) {
                this.x += (this.targetX - this.x) * params.slideSpeed;
                this.y += (this.targetY - this.y) * params.slideSpeed;
                this.scale = 1 + Math.sin(beat + this.pulsePhase) * params.pulseScale;
                const currentColor = hexToRgb(this.color);
                const targetColor = hexToRgb(this.targetColor);
                this.color = rgbToHex({
                    r: currentColor.r + (targetColor.r - currentColor.r) * params.colorChangeSpeed,
                    g: currentColor.g + (targetColor.g - currentColor.g) * params.colorChangeSpeed,
                    b: currentColor.b + (targetColor.b - currentColor.b) * params.colorChangeSpeed
                });
                if (Math.random() < 0.01) {
                    this.targetColor = colors[Math.floor(Math.random() * colors.length)];
                }
                this.glowIntensity = 0.5 + Math.sin(beat + this.pulsePhase) * 0.5;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 20 * this.glowIntensity;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                switch (this.shapeType) {
                    case 0:
                        ctx.beginPath();
                        ctx.arc(0, 0, params.cellSize / 2, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 1:
                        ctx.fillRect(-params.cellSize / 2, -params.cellSize / 2, params.cellSize, params.cellSize);
                        break;
                    case 2:
                        ctx.beginPath();
                        ctx.moveTo(0, -params.cellSize / 2);
                        ctx.lineTo(-params.cellSize / 2, params.cellSize / 2);
                        ctx.lineTo(params.cellSize / 2, params.cellSize / 2);
                        ctx.closePath();
                        ctx.fill();
                        break;
                }
                ctx.restore();
                ctx.shadowBlur = 0;
            }

            moveTo(newGridX, newGridY) {
                this.gridX = newGridX;
                this.gridY = newGridY;
                this.targetX = (newGridX + 0.5) * params.cellSize + (width - params.gridSize * params.cellSize) / 2;
                this.targetY = (newGridY + 0.5) * params.cellSize + (height - params.gridSize * params.cellSize) / 2;
                playSound(this.shapeType);
            }
        }

        const shapes = [];
        let emptyCell = { x: params.gridSize - 1, y: params.gridSize - 1 };

        function initShapes() {
            shapes.length = 0;
            for (let x = 0; x < params.gridSize; x++) {
                for (let y = 0; y < params.gridSize; y++) {
                    if (x !== emptyCell.x || y !== emptyCell.y) {
                        const posX = (x + 0.5) * params.cellSize + (width - params.gridSize * params.cellSize) / 2;
                        const posY = (y + 0.5) * params.cellSize + (height - params.gridSize * params.cellSize) / 2;
                        shapes.push(new Shape(posX, posY, x, y));
                    }
                }
            }
        }

        function shufflePuzzle() {
            const directions = [
                { dx: -1, dy: 0 }, { dx: 1, dy: 0 },
                { dx: 0, dy: -1 }, { dx: 0, dy: 1 }
            ];
            const validMoves = directions.filter(dir => {
                const newX = emptyCell.x + dir.dx;
                const newY = emptyCell.y + dir.dy;
                return newX >= 0 && newX < params.gridSize && newY >= 0 && newY < params.gridSize;
            });
            if (validMoves.length > 0) {
                const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                const newEmptyX = emptyCell.x + move.dx;
                const newEmptyY = emptyCell.y + move.dy;
                const shapeToMove = shapes.find(s => s.gridX === newEmptyX && s.gridY === newEmptyY);
                if (shapeToMove) {
                    shapeToMove.moveTo(emptyCell.x, emptyCell.y);
                    emptyCell = { x: newEmptyX, y: newEmptyY };
                }
            }
        }

        initShapes();

        let lastTime = 0;
        let beatCount = 0;

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            beatCount += deltaTime / params.beatInterval;
            const beat = Math.PI * 2 * beatCount;
            ctx.fillStyle = `rgba(0, 0, 0, ${0.1 + Math.sin(beat) * 0.05})`;
            ctx.fillRect(0, 0, width, height);
            shapes.forEach(shape => {
                shape.update(beat);
                shape.draw();
            });
            requestAnimationFrame(animate);
        }

        animate(0);
        setInterval(shufflePuzzle, params.shuffleInterval);

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHex(rgb) {
            return "#" + ((1 << 24) + (Math.round(rgb.r) << 16) + (Math.round(rgb.g) << 8) + Math.round(rgb.b)).toString(16).slice(1);
        }
    </script>
</body>
</html>
