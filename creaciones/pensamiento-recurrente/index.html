<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensamiento Recurrente</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1A1A1A;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #4A4A4A;
        }
        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4A4A4A;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="thoughtCanvas"></canvas>
    <button id="startButton">Iniciar Pensamiento</button>
    <script>
        const canvas = document.getElementById('thoughtCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');

        const canvasWidth = 540;
        const canvasHeight = 960;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        const gridSize = { x: 9, y: 16 };
        const cellSize = { 
            width: canvasWidth / gridSize.x,
            height: canvasHeight / gridSize.y
        };
        let thoughts = [];
        let isVictory = false;
        let animationStartTime;
        let cycleCount = 0;
        const ANIMATION_DURATION = 10000; // 10 segundos
        const CYCLES = 4;
        let currentCycleStartTime;
        let patternVisibility = 0;

        const colors = {
            positive: '#FFFFFF',
            negative: '#000000',
            board: '#1A1A1A',
            lines: '#2A2A2A',
            pattern: '#FFD700' // Color dorado para el patrón
        };

        class Thought {
            constructor(x, y, isPositive) {
                this.x = x;
                this.y = y;
                this.isPositive = isPositive;
                this.rotationX = 0;
                this.rotationY = 0;
                this.targetRotationX = 0;
                this.targetRotationY = 0;
                this.rotationSpeed = 0;
                this.updateColor();
            }

            updateColor() {
                this.color = this.isPositive ? colors.positive : colors.negative;
            }

            flip() {
                this.isPositive = !this.isPositive;
                this.targetRotationX += Math.PI;
                this.targetRotationY += Math.PI;
                this.rotationSpeed = 0.1;
                this.updateColor();
            }

            update(speedMultiplier) {
                if (this.rotationX !== this.targetRotationX || this.rotationY !== this.targetRotationY) {
                    this.rotationX += this.rotationSpeed * speedMultiplier;
                    this.rotationY += this.rotationSpeed * speedMultiplier;
                    if (Math.abs(this.rotationX - this.targetRotationX) < 0.1) {
                        this.rotationX = this.targetRotationX;
                        this.rotationY = this.targetRotationY;
                        this.rotationSpeed = 0;
                    }
                }
            }

            draw(alpha = 1) {
                const centerX = this.x * cellSize.width + cellSize.width/2;
                const centerY = this.y * cellSize.height + cellSize.height/2;
                const radius = Math.min(cellSize.width, cellSize.height) * 0.4;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(centerX, centerY);

                const gradient = ctx.createRadialGradient(-radius*0.3, -radius*0.3, 0, 0, 0, radius);
                gradient.addColorStop(0, '#FFFFFF');
                gradient.addColorStop(1, this.color);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.rotate(this.rotationX);
                const patternColor = this.isPositive ? '#000000' : '#FFFFFF';
                ctx.fillStyle = patternColor;
                
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.5, 0, Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(radius * 0.25, 0, radius * 0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(-radius * 0.25, 0, radius * 0.25, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(centerX, centerY);
                ctx.rotate(this.rotationY);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(-radius*0.2, -radius*0.2, radius*0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initThoughts() {
            thoughts = [];
            for (let y = 0; y < gridSize.y; y++) {
                for (let x = 0; x < gridSize.x; x++) {
                    thoughts.push(new Thought(x, y, Math.random() > 0.7));
                }
            }
        }

        function changeThought() {
            const negativeThoughts = thoughts.filter(t => !t.isPositive);
            if (negativeThoughts.length > 0) {
                const thought = negativeThoughts[Math.floor(Math.random() * negativeThoughts.length)];
                thought.flip();
            }
        }

        function drawBoard(alpha = 1) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = colors.board;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            ctx.strokeStyle = colors.lines;
            ctx.lineWidth = 1;

            for (let x = 0; x <= gridSize.x; x++) {
                ctx.beginPath();
                ctx.moveTo(x * cellSize.width, 0);
                ctx.lineTo(x * cellSize.width, canvasHeight);
                ctx.stroke();
            }

            for (let y = 0; y <= gridSize.y; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * cellSize.height);
                ctx.lineTo(canvasWidth, y * cellSize.height);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawGeometricPattern() {
            ctx.save();
            ctx.globalAlpha = patternVisibility;
            
            const baseThickness = 2;
            const thickness = baseThickness + (cycleCount * 1.5);
            
            const baseBrightness = 100;
            const maxBrightness = 200;
            const brightness = Math.min(baseBrightness + (cycleCount * 25), maxBrightness);
            
            const centerX = canvasWidth / 2;
            const centerY = canvasHeight / 2;
            const radius = Math.min(canvasWidth, canvasHeight) * 0.4;
            
            ctx.shadowColor = `rgba(255, 215, 0, 0.3)`;
            ctx.shadowBlur = 5 + cycleCount * 3;
            ctx.shadowOffsetX = 1 + cycleCount * 0.5;
            ctx.shadowOffsetY = 1 + cycleCount * 0.5;

            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                gradient.addColorStop(0, `rgba(255, 215, 0, 0.1)`);
                gradient.addColorStop(0.7, `rgba(255, 215, 0, 0.5)`);
                gradient.addColorStop(1, `rgb(255, ${brightness}, 0)`);

                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.lineWidth = thickness;
                ctx.strokeStyle = gradient;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x, y, radius * 0.9, 0, Math.PI * 2);
                ctx.lineWidth = thickness * 0.5;
                ctx.strokeStyle = `rgba(255, 215, 0, 0.3)`;
                ctx.stroke();
            }
            
            const centralGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            centralGradient.addColorStop(0, `rgba(255, 215, 0, 0.1)`);
            centralGradient.addColorStop(0.7, `rgba(255, 215, 0, 0.5)`);
            centralGradient.addColorStop(1, `rgb(255, ${brightness}, 0)`);

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.lineWidth = thickness;
            ctx.strokeStyle = centralGradient;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.9, 0, Math.PI * 2);
            ctx.lineWidth = thickness * 0.5;
            ctx.strokeStyle = `rgba(255, 215, 0, 0.3)`;
            ctx.stroke();
            
            ctx.restore();
        }

        function checkVictory() {
            if (thoughts.every(t => t.isPositive)) {
                isVictory = true;
                cycleCount++;
                currentCycleStartTime = null;
            }
        }

        function draw(progress, cycleProgress) {
            const thoughtsAlpha = Math.max(0, 1 - patternVisibility);
            drawBoard(thoughtsAlpha);
            thoughts.forEach(thought => thought.draw(thoughtsAlpha));
            drawGeometricPattern();

            if (progress > 0.9) {
                patternVisibility = 1;
                drawGeometricPattern();
            }
        }

        function animate(currentTime) {
            if (!animationStartTime) {
                animationStartTime = currentTime;
                currentCycleStartTime = currentTime;
            }
            const elapsedTime = currentTime - animationStartTime;
            const progress = Math.min(elapsedTime / ANIMATION_DURATION, 1);

            if (!currentCycleStartTime) {
                currentCycleStartTime = currentTime;
                initThoughts();
            }

            const cycleProgress = (currentTime - currentCycleStartTime) / (ANIMATION_DURATION / CYCLES);
            const speedMultiplier = 1 + (cycleCount * 1) + (cycleProgress * 3);

            if (!isVictory && Math.random() < 0.15 * speedMultiplier) changeThought();
            thoughts.forEach(thought => thought.update(speedMultiplier));
            
            if (isVictory) {
                patternVisibility = Math.min(patternVisibility + 0.05 * (cycleCount + 1), 1);
                if (cycleProgress > 0.15 - (cycleCount * 0.02)) {
                    isVictory = false;
                    patternVisibility = Math.max(patternVisibility - 0.2, 0);
                    initThoughts();
                }
            }

            checkVictory();
            draw(progress, cycleProgress);

            if (progress < 1) {
                requestAnimationFrame(animate);
            }
        }

        startButton.addEventListener('click', () => {
            startButton.style.display = 'none';
            animationStartTime = null;
            cycleCount = 0;
            patternVisibility = 0;
            initThoughts();
            requestAnimationFrame(animate);
        });

        drawBoard();
    </script>
</body>
</html>
