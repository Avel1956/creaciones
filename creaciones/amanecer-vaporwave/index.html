<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanecer con Taza de Café Vectorial Vaporwave-Tron</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #120458;
        }
        #svg-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <svg id="svg-container" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
        <!-- Fondo con gradiente de amanecer -->
        <defs>
            <linearGradient id="sky-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#FF6AD5"/>
                <stop offset="50%" style="stop-color:#C774E8"/>
                <stop offset="100%" style="stop-color:#120458"/>
            </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#sky-gradient)"/>
        
        <!-- Sol naciente -->
        <circle cx="540" cy="300" r="150" fill="#FFD700">
            <animate attributeName="cy" values="500;300" dur="10s" repeatCount="indefinite"/>
            <animate attributeName="r" values="100;150" dur="10s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Estrellas desvaneciéndose -->
        <g id="stars">
            <circle cx="100" cy="200" r="2" fill="#FFFFFF">
                <animate attributeName="opacity" values="1;0" dur="5s" repeatCount="indefinite"/>
            </circle>
            <circle cx="300" cy="400" r="2" fill="#FFFFFF">
                <animate attributeName="opacity" values="1;0" dur="5s" repeatCount="indefinite" begin="1s"/>
            </circle>
            <circle cx="700" cy="100" r="2" fill="#FFFFFF">
                <animate attributeName="opacity" values="1;0" dur="5s" repeatCount="indefinite" begin="2s"/>
            </circle>
        </g>
        
        <!-- Taza de café -->
        <g id="coffee-cup">
            <!-- Cuerpo de la taza con efecto de neón -->
            <path d="M300 1000 L780 1000 L720 1600 L360 1600 Z" fill="#4A0E0E" stroke="#00FFFF" stroke-width="4">
                <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
            </path>
            <path d="M300 1000 L780 1000 L720 1600 L360 1600 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5">
                <animate attributeName="stroke-opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
            </path>
            
            <!-- Espuma del café animada -->
            <path d="M300 1000 Q540 950 780 1000" fill="none" stroke="#FFFFFF" stroke-width="6">
                <animate attributeName="d" 
                         values="M300 1000 Q540 950 780 1000;
                                 M300 1000 Q540 1050 780 1000;
                                 M300 1000 Q540 950 780 1000" 
                         dur="4s" repeatCount="indefinite"/>
            </path>
            
            <!-- Asas con efecto de neón -->
            <path d="M780 1100 Q900 1200 780 1300" fill="none" stroke="#00FFFF" stroke-width="4">
                <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
            </path>
            <path d="M300 1100 Q180 1200 300 1300" fill="none" stroke="#00FFFF" stroke-width="4">
                <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
            </path>
        </g>
        
        <!-- Vapor del café mejorado -->
        <g id="coffee-vapor">
            <path d="M400 950 Q440 850 480 950 Q520 750 560 950" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7">
                <animate attributeName="d" 
                         values="M400 950 Q440 850 480 950 Q520 750 560 950;
                                 M400 950 Q440 750 480 950 Q520 850 560 950;
                                 M400 950 Q440 850 480 950 Q520 750 560 950" 
                         dur="6s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.7;0.3;0.7" dur="6s" repeatCount="indefinite"/>
            </path>
            <path d="M520 950 Q560 850 600 950 Q640 750 680 950" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7">
                <animate attributeName="d" 
                         values="M520 950 Q560 850 600 950 Q640 750 680 950;
                                 M520 950 Q560 750 600 950 Q640 850 680 950;
                                 M520 950 Q560 850 600 950 Q640 750 680 950" 
                         dur="6s" repeatCount="indefinite" begin="3s"/>
                <animate attributeName="opacity" values="0.7;0.3;0.7" dur="6s" repeatCount="indefinite" begin="3s"/>
            </path>
        </g>
        
        <!-- Líneas de horizonte -->
        <g id="horizon-lines">
            <line x1="0" y1="1700" x2="1080" y2="1700" stroke="#00FFFF" stroke-width="2" opacity="0.5">
                <animate attributeName="y1" attributeName2="y2" values="1700;1720;1700" dur="4s" repeatCount="indefinite"/>
            </line>
            <line x1="0" y1="1800" x2="1080" y2="1800" stroke="#00FFFF" stroke-width="2" opacity="0.3">
                <animate attributeName="y1" attributeName2="y2" values="1800;1830;1800" dur="4s" repeatCount="indefinite" begin="1s"/>
            </line>
        </g>
    </svg>
</body>
</html>
