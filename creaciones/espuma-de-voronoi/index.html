<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voronoi Foaming Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<canvas id="animationCanvas"></canvas>
<script>
  const width = 1080; // Instagram preferred width
  const height = 1080; // Instagram preferred height for portrait videos
  const numParticles = 2;
  const voronoiSites = 1000;
  const voronoiUpdateInterval = 6000; // Interval to update Voronoi diagram and colors in milliseconds
  const interpolationSpeed = 0.01; // Speed of interpolation for smooth transitions

  const canvas = document.getElementById('animationCanvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');

  const particles = d3.range(numParticles).map(() => ({
    x: Math.random() * width,
    y: Math.random() * height,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5,
    color: '#fff'
  }));

  const palettes = {
  ethereal: ['rgba(255, 182, 193, 0.5)', 'rgba(224, 255, 255, 0.5)', 'rgba(221, 160, 221, 0.5)', 'rgba(240, 230, 140, 0.5)', 'rgba(255, 240, 245, 0.5)'],
  fear: ['rgba(0, 0, 0, 0.7)', 'rgba(105, 105, 105, 0.7)', 'rgba(47, 79, 79, 0.7)', 'rgba(112, 128, 144, 0.7)', 'rgba(169, 169, 169, 0.7)'],
  hope: ['rgba(173, 216, 230, 0.5)', 'rgba(144, 238, 144, 0.5)', 'rgba(255, 255, 224, 0.5)', 'rgba(240, 255, 255, 0.5)', 'rgba(255, 228, 196, 0.5)'],
  ambition: ['rgba(255, 140, 0, 0.5)', 'rgba(218, 165, 32, 0.5)', 'rgba(184, 134, 11, 0.5)', 'rgba(210, 105, 30, 0.5)', 'rgba(255, 69, 0, 0.5)'],
  laziness: ['rgba(176, 196, 222, 0.5)', 'rgba(211, 211, 211, 0.5)', 'rgba(192, 192, 192, 0.5)', 'rgba(169, 169, 169, 0.5)', 'rgba(128, 128, 128, 0.5)'],
  determination: ['rgba(0, 0, 255, 0.5)', 'rgba(0, 191, 255, 0.5)', 'rgba(30, 144, 255, 0.5)', 'rgba(65, 105, 225, 0.5)', 'rgba(70, 130, 180, 0.5)'],
  anxiety: ['rgba(255, 69, 0, 0.5)', 'rgba(255, 165, 0, 0.5)', 'rgba(255, 99, 71, 0.5)', 'rgba(255, 140, 0, 0.5)', 'rgba(255, 127, 80, 0.5)'],
  calm: ['rgba(173, 216, 230, 0.5)', 'rgba(135, 206, 250, 0.5)', 'rgba(176, 224, 230, 0.5)', 'rgba(175, 238, 238, 0.5)', 'rgba(224, 255, 255, 0.5)']
};


  let currentEmotion = 'hope';
  let cellColors = [];
  let currentSites = d3.range(voronoiSites).map(() => [Math.random() * width, Math.random() * height]);
  let targetSites = d3.range(voronoiSites).map(() => [Math.random() * width, Math.random() * height]);

  function updateTargetSites() {
    targetSites = d3.range(voronoiSites).map(() => [Math.random() * width, Math.random() * height]);
    const palette = palettes[currentEmotion];
    cellColors = targetSites.map((_, i) => palette[i % palette.length]);
  }

  function interpolateSites() {
    for (let i = 0; i < currentSites.length; i++) {
      currentSites[i][0] += (targetSites[i][0] - currentSites[i][0]) * interpolationSpeed;
      currentSites[i][1] += (targetSites[i][1] - currentSites[i][1]) * interpolationSpeed;
    }
  }

  function updateParticles() {
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;

      if (p.x > width) p.vx = -Math.abs(p.vx);
      if (p.x < 0) p.vx = Math.abs(p.vx);
      if (p.y > height) p.vy = -Math.abs(p.vy);
      if (p.y < 0) p.vy = Math.abs(p.vy);
    });
  }

  function drawRoundedPolygon(points, radius) {
    context.beginPath();
    if (points.length > 0) {
      context.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) {
        const midPointX = (points[i][0] + points[i - 1][0]) / 2;
        const midPointY = (points[i][1] + points[i - 1][1]) / 2;
        context.quadraticCurveTo(points[i - 1][0], points[i - 1][1], midPointX, midPointY);
      }
      context.quadraticCurveTo(points[points.length - 1][0], points[points.length - 1][1], points[0][0], points[0][1]);
    }
    context.closePath();
  }

  function drawVoronoi() {
    const delaunay = d3.Delaunay.from(currentSites);
    const voronoi = delaunay.voronoi([0, 0, width, height]);
    context.clearRect(0, 0, width, height);

    currentSites.forEach((site, i) => {
      const cell = voronoi.cellPolygon(i);
      if (cell) {
        drawRoundedPolygon(cell, 10); // Add rounding to the cells
        context.fillStyle = cellColors[i];
        context.fill();
        context.lineWidth = 2; // Add thinner borders for the delicate effect
        context.strokeStyle = 'rgba(255, 255, 255, 0.6)'; // Light border color for ethereal feel
        context.stroke();
      }
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      context.beginPath();
      context.arc(p.x, p.y, 2, 0, 2 * Math.PI);
      context.fillStyle = p.color;
      context.globalAlpha = 0.6;
      context.fill();
    });
  }

  let lastVoronoiUpdateTime = 0;

  function animate(timestamp) {
    if (timestamp - lastVoronoiUpdateTime > voronoiUpdateInterval) {
      updateTargetSites();
      lastVoronoiUpdateTime = timestamp;
    }
    interpolateSites();
    updateParticles();
    drawVoronoi();
    drawParticles();
    requestAnimationFrame(animate);
  }

  window.onload = () => {
    setEmotion(currentEmotion); // Ensure the emotion is set correctly before starting the animation
    updateTargetSites(); // Ensure the colors are updated immediately
    requestAnimationFrame(animate);
  };

  // To change the emotion, call the following function with the desired emotion
  function setEmotion(emotion) {
    if (palettes[emotion]) {
      currentEmotion = emotion;
      updateTargetSites();
      lastVoronoiUpdateTime = 0; // Reset the timer to force an immediate update
    }
  }
</script>
</body>
</html>
