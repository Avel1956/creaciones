<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorenz Attractor Calligraphy for Instagram Reels</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1A1A1A;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const palettes = [
            ['#F7F3E8', '#E5DCC7', '#8C3A36', '#2C2C2C', '#D7BC8A'],
            ['#05668D', '#028090', '#00A896', '#02C39A', '#F0F3BD'],
            ['#D7263D', '#F46036', '#2E294E', '#1B998B', '#C5D86D'],
            ['#2D3142', '#4F5D75', '#BFC0C0', '#FFFFFF', '#EF8354'],
            ['#114B5F', '#1A936F', '#88D498', '#C6DABF', '#F3E9D2']
        ];

        let currentPalette = 0;
        let showTexture = true;

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * 20 - 10;
                this.y = Math.random() * 20 - 10;
                this.z = Math.random() * 20 - 10;
                this.pz = this.z;
                this.px = this.x;
                this.py = this.y;
                this.angle = 0;
                this.color = palettes[currentPalette][Math.floor(Math.random() * palettes[currentPalette].length)];
                this.size = Math.random() * 6 + 1;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.speed = Math.random() * 0.7 + 0.3;
            }

            update(dt) {
                const sigma = 10;
                const rho = 28;
                const beta = 8/3;

                const dx = sigma * (this.y - this.x);
                const dy = this.x * (rho - this.z) - this.y;
                const dz = this.x * this.y - beta * this.z;

                this.px = this.x;
                this.py = this.y;
                this.pz = this.z;

                this.x += dx * dt * this.speed;
                this.y += dy * dt * this.speed;
                this.z += dz * dt * this.speed;

                this.angle += 0.01;
            }

            draw() {
                const scale = Math.min(width, height) / 25;
                const x = (this.x * scale) + width / 2;
                const y = (this.y * scale) + height / 2;
                const px = (this.px * scale) + width / 2;
                const py = (this.py * scale) + height / 2;

                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.size;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(x, y);
                ctx.stroke();

                // Ink dispersion effect
                ctx.globalAlpha = 0.05;
                ctx.beginPath();
                ctx.arc(x, y, this.size * 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = 1;
            }
        }

        const particles = Array(1500).fill().map(() => new Particle());

        function drawTexture() {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = Math.random() * 10 - 5;
                data[i] = Math.max(0, Math.min(255, data[i] + noise));
                data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise));
                data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise));
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function animate() {
            ctx.fillStyle = 'rgba(26, 26, 26, 0.03)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update(0.0035);
                p.draw();
            });

            if (showTexture) {
                drawTexture();
            }

            requestAnimationFrame(animate);
        }

        function resetAnimation() {
            currentPalette = (currentPalette + 1) % palettes.length;
            particles.forEach(p => p.reset());
            ctx.clearRect(0, 0, width, height);
        }

        window.addEventListener('load', () => {
            resizeCanvas();
            animate();
        });

        canvas.addEventListener('click', resetAnimation);
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                resetAnimation();
            } else if (event.code === 'KeyT') {
                showTexture = !showTexture;
            }
        });
    </script>
</body>
</html>
